name: Windows build
on:
  push:
    branches: [main]
    paths-ignore: ['website/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native app
        shell: pwsh
        run: ./build.ps1
      - name: Core assertions
        shell: pwsh
        run: |
          $test = Start-Process ./dist/3.14.exe -ArgumentList '--self-test' -Wait -PassThru
          Get-Content ./test-results.txt
          if ($test.ExitCode -ne 0) { throw 'Core assertions failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: 3.14-windows-x64-portable
          path: |
            dist/3.14.exe
            dist/README.md
